schema-version = "1.10.0"

[install]
coreutils.pkg-path = "coreutils"
gnused.pkg-path = "gnused"
jq.pkg-path = "jq"
curl.pkg-path = "curl"
git.pkg-path = "git"
gnupg.pkg-path = "gnupg"
xz.pkg-path = "xz"

[build.flox-audit]
description = "flox audit: trace a package in a Flox environment back to its signed binary, build recipe and source"
version = "0.3.3"
command = '''
  mkdir -p $out/bin
  cp flox-audit $out/bin/flox-audit
  chmod +x $out/bin/flox-audit
  mkdir -p $out/share/doc/flox-audit
  cp LICENSE $out/share/doc/flox-audit/LICENSE
'''
runtime-packages = ["coreutils", "gnused", "jq", "curl", "git", "gnupg", "xz"]
